<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 780" width="360" height="780">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0C0E12" />
      <stop offset="100%" stop-color="#141822" />
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E676" />
      <stop offset="50%" stop-color="#00E5FF" />
      <stop offset="100%" stop-color="#0084FF" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181C26" />
      <stop offset="100%" stop-color="#13161F" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="360" height="780" rx="36" fill="url(#bg)" stroke="#262D3D" stroke-width="2"/>

  <!-- Status Bar -->
  <text x="24" y="32" fill="#F0F3F8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">09:41</text>
  <circle cx="310" cy="28" r="3" fill="#00E676"/>
  <rect x="320" y="23" width="18" height="10" rx="2" fill="none" stroke="#F0F3F8" stroke-width="1.2"/>
  <rect x="322" y="25" width="13" height="6" rx="1" fill="#00E676"/>

  <!-- App Header -->
  <text x="20" y="68" fill="#F0F3F8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700">VoltPower</text>
  <rect x="132" y="52" width="98" height="22" rx="11" fill="#00E676" fill-opacity="0.15" stroke="#00E676" stroke-width="1"/>
  <circle cx="144" cy="63" r="4" fill="#00E676"/>
  <text x="154" y="67" fill="#00E676" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700">ROOT ACTIVE</text>

  <!-- Circular Battery Dial -->
  <g transform="translate(180, 175)">
    <!-- Base track -->
    <circle cx="0" cy="0" r="76" fill="none" stroke="#1F2433" stroke-width="12"/>
    <!-- Active progress arc (85%) -->
    <circle cx="0" cy="0" r="76" fill="none" stroke="url(#ringGrad)" stroke-width="12" stroke-linecap="round" stroke-dasharray="477.5" stroke-dashoffset="71.6" transform="rotate(-90)" filter="url(#glow)"/>
    <text x="0" y="8" fill="#FFFFFF" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="38" font-weight="800">85%</text>
    <text x="0" y="30" fill="#00E5FF" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">⚡ 38.5W Rapid</text>
    <text x="0" y="46" fill="#9DA4B0" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">4,312 mV · 4,450 mAh</text>
  </g>

  <!-- Metric Quick Cards -->
  <g transform="translate(20, 275)">
    <!-- Card 1 Temp -->
    <rect x="0" y="0" width="100" height="66" rx="14" fill="url(#cardGrad)" stroke="#222838" stroke-width="1"/>
    <text x="12" y="22" fill="#9DA4B0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="500">THERMAL</text>
    <text x="12" y="44" fill="#00E676" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700">31.4°C</text>
    <text x="12" y="58" fill="#6B7280" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9">Optimal Zone</text>

    <!-- Card 2 Health -->
    <rect x="110" y="0" width="100" height="66" rx="14" fill="url(#cardGrad)" stroke="#222838" stroke-width="1"/>
    <text x="122" y="22" fill="#9DA4B0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="500">HEALTH</text>
    <text x="122" y="44" fill="#0084FF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700">98%</text>
    <text x="122" y="58" fill="#6B7280" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9">Good Condition</text>

    <!-- Card 3 Cycles -->
    <rect x="220" y="0" width="100" height="66" rx="14" fill="url(#cardGrad)" stroke="#222838" stroke-width="1"/>
    <text x="232" y="22" fill="#9DA4B0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="500">CYCLES</text>
    <text x="232" y="44" fill="#FFAB00" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700">142</text>
    <text x="232" y="58" fill="#6B7280" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9">Count Logged</text>
  </g>

  <!-- Profiles Selector Card -->
  <g transform="translate(20, 355)">
    <rect x="0" y="0" width="320" height="110" rx="16" fill="url(#cardGrad)" stroke="#222838" stroke-width="1"/>
    <text x="16" y="26" fill="#F0F3F8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700">Active Profile</text>
    <rect x="210" y="12" width="94" height="20" rx="10" fill="#0084FF" fill-opacity="0.15"/>
    <text x="257" y="26" fill="#0084FF" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700">POWERSAVE</text>

    <!-- Profile Chips -->
    <g transform="translate(14, 44)">
      <!-- Powersave selected -->
      <rect x="0" y="0" width="92" height="52" rx="12" fill="#0084FF" fill-opacity="0.2" stroke="#0084FF" stroke-width="1.5"/>
      <text x="46" y="24" fill="#00E5FF" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">⚡ Powersave</text>
      <text x="46" y="40" fill="#F0F3F8" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9">HyperOS Mode</text>

      <!-- Balanced -->
      <rect x="100" y="0" width="92" height="52" rx="12" fill="#1B202D" stroke="#252C3D" stroke-width="1"/>
      <text x="146" y="24" fill="#9DA4B0" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">⚖ Balanced</text>
      <text x="146" y="40" fill="#6B7280" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9">Auto Governed</text>

      <!-- Performance -->
      <rect x="200" y="0" width="92" height="52" rx="12" fill="#1B202D" stroke="#252C3D" stroke-width="1"/>
      <text x="246" y="24" fill="#9DA4B0" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">🔥 Performance</text>
      <text x="246" y="40" fill="#6B7280" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9">Uncapped</text>
    </g>
  </g>

  <!-- CPU Clocks Telemetry Card -->
  <g transform="translate(20, 480)">
    <rect x="0" y="0" width="320" height="200" rx="16" fill="url(#cardGrad)" stroke="#222838" stroke-width="1"/>
    <text x="16" y="28" fill="#F0F3F8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700">Octa-Core CPU Telemetry</text>
    <text x="240" y="28" fill="#00E676" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">schedutil</text>

    <!-- Core 0-3 Little -->
    <text x="16" y="56" fill="#9DA4B0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">Cores 0-3 (Cortex-A510)</text>
    <text x="260" y="56" fill="#00E5FF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600">1,200 MHz</text>
    <rect x="16" y="64" width="288" height="6" rx="3" fill="#1F2433"/>
    <rect x="16" y="64" width="120" height="6" rx="3" fill="#00E5FF"/>

    <!-- Core 4-6 Mid -->
    <text x="16" y="96" fill="#9DA4B0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">Cores 4-6 (Cortex-A715)</text>
    <text x="260" y="96" fill="#0084FF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600">1,651 MHz</text>
    <rect x="16" y="104" width="288" height="6" rx="3" fill="#1F2433"/>
    <rect x="16" y="104" width="168" height="6" rx="3" fill="#0084FF"/>

    <!-- Core 7 Prime -->
    <text x="16" y="136" fill="#9DA4B0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">Core 7 (Cortex-X3 Prime)</text>
    <text x="260" y="136" fill="#FFAB00" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600">Parked / Eco</text>
    <rect x="16" y="144" width="288" height="6" rx="3" fill="#1F2433"/>
    <rect x="16" y="144" width="58" height="6" rx="3" fill="#FFAB00"/>

    <!-- GPU & I/O Line -->
    <line x1="16" y1="166" x2="304" y2="166" stroke="#222838" stroke-width="1"/>
    <text x="16" y="186" fill="#9DA4B0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">Adreno GPU: 300MHz (Powersave)</text>
    <text x="230" y="186" fill="#00E676" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600">ZRAM: 3.2G Free</text>
  </g>

  <!-- Bottom Navigation Bar -->
  <g transform="translate(0, 700)">
    <rect width="360" height="80" fill="#11141C" stroke="#1F2433" stroke-width="1"/>
    <!-- Dashboard Active -->
    <circle cx="65" cy="24" r="14" fill="#0084FF" fill-opacity="0.2"/>
    <path d="M59 28 L65 17 L71 28 Z" fill="#0084FF"/>
    <text x="65" y="48" fill="#0084FF" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700">Dashboard</text>

    <!-- Tweaks -->
    <text x="145" y="28" fill="#6B7280" text-anchor="middle" font-size="16">⚙</text>
    <text x="145" y="48" fill="#6B7280" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">Tweaks</text>

    <!-- Profiles -->
    <text x="225" y="28" fill="#6B7280" text-anchor="middle" font-size="16">⚡</text>
    <text x="225" y="48" fill="#6B7280" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">Profiles</text>

    <!-- Logs -->
    <text x="300" y="28" fill="#6B7280" text-anchor="middle" font-size="16">📜</text>
    <text x="300" y="48" fill="#6B7280" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">Logs</text>
  </g>
</svg>
