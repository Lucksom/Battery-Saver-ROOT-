<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 840" width="360" height="840">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0C0E12" />
      <stop offset="100%" stop-color="#141822" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#171A24" />
      <stop offset="100%" stop-color="#13161F" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="360" height="840" rx="36" fill="url(#bg)" stroke="#262D3D" stroke-width="2"/>

  <!-- Status Bar -->
  <text x="24" y="30" fill="#F0F3F8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">09:41</text>
  <circle cx="310" cy="26" r="3" fill="#00E676"/>
  <rect x="320" y="21" width="18" height="10" rx="2" fill="none" stroke="#F0F3F8" stroke-width="1.2"/>
  <rect x="322" y="23" width="13" height="6" rx="1" fill="#00E676"/>

  <!-- App Header -->
  <text x="20" y="64" fill="#F0F3F8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700">VoltPower Tweaks</text>
  <text x="20" y="78" fill="#9DA4B0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Balanced &amp; Performance Engines</text>
  <rect x="238" y="50" width="102" height="24" rx="12" fill="#0084FF" fill-opacity="0.15" stroke="#0084FF" stroke-width="1"/>
  <text x="289" y="66" fill="#0084FF" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700">BALANCED</text>

  <!-- Stock Revert Safe Banner -->
  <g transform="translate(16, 92)">
    <rect x="0" y="0" width="328" height="52" rx="16" fill="url(#cardGrad)" stroke="#222838" stroke-width="1"/>
    <rect x="12" y="10" width="32" height="32" rx="10" fill="#00E676" fill-opacity="0.15"/>
    <text x="28" y="30" fill="#00E676" text-anchor="middle" font-size="14">🛡</text>
    <text x="52" y="24" fill="#F0F3F8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">Stock Factory Snapshot</text>
    <text x="52" y="38" fill="#9DA4B0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">Original System Settings Preserved</text>
    <rect x="236" y="14" width="80" height="24" rx="12" fill="#222838" stroke="#374151" stroke-width="1"/>
    <text x="276" y="30" fill="#00E5FF" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600">Revert Stock</text>
  </g>

  <!-- Section 1: CPU Energy Scaling & Clocks -->
  <g transform="translate(16, 154)">
    <rect x="0" y="0" width="328" height="190" rx="20" fill="url(#cardGrad)" stroke="#222838" stroke-width="1"/>
    <text x="16" y="26" fill="#F0F3F8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">CPU Energy Scaling &amp; Clocks</text>
    <rect x="246" y="12" width="68" height="18" rx="9" fill="#00E5FF" fill-opacity="0.15"/>
    <text x="280" y="24" fill="#00E5FF" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700">4 TWEAKS</text>

    <!-- Tweak 1: 70% CPU Cap -->
    <g transform="translate(14, 40)">
      <rect x="0" y="6" width="32" height="32" rx="8" fill="#00E5FF" fill-opacity="0.15"/>
      <text x="16" y="27" fill="#00E5FF" text-anchor="middle" font-size="14">⚡</text>
      <text x="40" y="18" fill="#F0F3F8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">70% CPU Max Frequency Cap</text>
      <text x="40" y="32" fill="#9DA4B0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9">Balances fluid 120Hz/90Hz UI and battery longevity</text>
      <rect x="262" y="10" width="38" height="22" rx="11" fill="#222838"/>
      <circle cx="273" cy="21" r="8" fill="#9DA4B0"/>
    </g>

    <!-- Tweak 2: CFS Latency Tuning -->
    <g transform="translate(14, 88)">
      <line x1="0" y1="0" x2="300" y2="0" stroke="#222838" stroke-width="0.8"/>
      <rect x="0" y="8" width="32" height="32" rx="8" fill="#00E676" fill-opacity="0.15"/>
      <text x="16" y="29" fill="#00E676" text-anchor="middle" font-size="14">⚙</text>
      <text x="40" y="20" fill="#F0F3F8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">CFS Scheduler &amp; Latency Tuning</text>
      <text x="40" y="34" fill="#9DA4B0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9">Optimizes target latency and migration cost in kernel</text>
      <rect x="262" y="12" width="38" height="22" rx="11" fill="#222838"/>
      <circle cx="273" cy="23" r="8" fill="#9DA4B0"/>
    </g>

    <!-- Tweak 3: RAM Dynamic Scaling -->
    <g transform="translate(14, 136)">
      <line x1="0" y1="0" x2="300" y2="0" stroke="#222838" stroke-width="0.8"/>
      <rect x="0" y="8" width="32" height="32" rx="8" fill="#0084FF" fill-opacity="0.15"/>
      <text x="16" y="29" fill="#0084FF" text-anchor="middle" font-size="14">💾</text>
      <text x="40" y="20" fill="#F0F3F8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">Dynamic RAM &amp; ZRAM Scaling</text>
      <text x="40" y="34" fill="#9DA4B0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9">Swappiness 60, LZ4 algorithm, 40MB dirty ratio in memory</text>
      <rect x="262" y="12" width="38" height="22" rx="11" fill="#222838"/>
      <circle cx="273" cy="23" r="8" fill="#9DA4B0"/>
    </g>
  </g>

  <!-- Section 2: Storage & Network -->
  <g transform="translate(16, 356)">
    <rect x="0" y="0" width="328" height="190" rx="20" fill="url(#cardGrad)" stroke="#222838" stroke-width="1"/>
    <text x="16" y="26" fill="#F0F3F8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">Storage I/O &amp; Network Acceleration</text>
    <rect x="246" y="12" width="68" height="18" rx="9" fill="#00E676" fill-opacity="0.15"/>
    <text x="280" y="24" fill="#00E676" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700">4 TWEAKS</text>

    <!-- Tweak 1: Kyber Multi-Queue -->
    <g transform="translate(14, 40)">
      <rect x="0" y="6" width="32" height="32" rx="8" fill="#00E676" fill-opacity="0.15"/>
      <text x="16" y="27" fill="#00E676" text-anchor="middle" font-size="14">🗄</text>
      <text x="40" y="18" fill="#F0F3F8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">Kyber / BFQ Multi-Queue Scheduler</text>
      <text x="40" y="32" fill="#9DA4B0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9">Selects lowest-latency multi-queue scheduler across flash</text>
      <rect x="262" y="10" width="38" height="22" rx="11" fill="#222838"/>
      <circle cx="273" cy="21" r="8" fill="#9DA4B0"/>
    </g>

    <!-- Tweak 2: Google BBR TCP -->
    <g transform="translate(14, 88)">
      <line x1="0" y1="0" x2="300" y2="0" stroke="#222838" stroke-width="0.8"/>
      <rect x="0" y="8" width="32" height="32" rx="8" fill="#0084FF" fill-opacity="0.15"/>
      <text x="16" y="29" fill="#0084FF" text-anchor="middle" font-size="14">📶</text>
      <text x="40" y="20" fill="#F0F3F8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">Google BBR Congestion Control &amp; FQ</text>
      <text x="40" y="34" fill="#9DA4B0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9">BBR maximizes throughput on Wi-Fi and 5G cellular</text>
      <rect x="262" y="12" width="38" height="22" rx="11" fill="#222838"/>
      <circle cx="273" cy="23" r="8" fill="#9DA4B0"/>
    </g>

    <!-- Tweak 3: TCP Fast Open -->
    <g transform="translate(14, 136)">
      <line x1="0" y1="0" x2="300" y2="0" stroke="#222838" stroke-width="0.8"/>
      <rect x="0" y="8" width="32" height="32" rx="8" fill="#00E5FF" fill-opacity="0.15"/>
      <text x="16" y="29" fill="#00E5FF" text-anchor="middle" font-size="14">⏩</text>
      <text x="40" y="20" fill="#F0F3F8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">TCP Fast Open Level 3 (Client+Server)</text>
      <text x="40" y="34" fill="#9DA4B0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9">Skips TCP handshake round-trips for instant connection</text>
      <rect x="262" y="12" width="38" height="22" rx="11" fill="#222838"/>
      <circle cx="273" cy="23" r="8" fill="#9DA4B0"/>
    </g>
  </g>

  <!-- Section 3: Deep Sleep & Process Optimization -->
  <g transform="translate(16, 558)">
    <rect x="0" y="0" width="328" height="180" rx="20" fill="url(#cardGrad)" stroke="#222838" stroke-width="1"/>
    <text x="16" y="26" fill="#F0F3F8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">Deep Sleep &amp; Process Optimization</text>
    <rect x="246" y="12" width="68" height="18" rx="9" fill="#00E676" fill-opacity="0.15"/>
    <text x="280" y="24" fill="#00E676" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700">3 TWEAKS</text>

    <!-- Tweak 1: 5-Min Doze -->
    <g transform="translate(14, 40)">
      <rect x="0" y="6" width="32" height="32" rx="8" fill="#00E676" fill-opacity="0.15"/>
      <text x="16" y="27" fill="#00E676" text-anchor="middle" font-size="14">💤</text>
      <text x="40" y="18" fill="#F0F3F8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">5-Minute Screen-Off Deep Sleep</text>
      <text x="40" y="32" fill="#9DA4B0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9">Transitions into deep doze after 5 mins screen-off in RAM</text>
      <rect x="262" y="10" width="38" height="22" rx="11" fill="#222838"/>
      <circle cx="273" cy="21" r="8" fill="#9DA4B0"/>
    </g>

    <!-- Tweak 2: Process Limit -->
    <g transform="translate(14, 88)">
      <line x1="0" y1="0" x2="300" y2="0" stroke="#222838" stroke-width="0.8"/>
      <rect x="0" y="8" width="32" height="32" rx="8" fill="#0084FF" fill-opacity="0.15"/>
      <text x="16" y="29" fill="#0084FF" text-anchor="middle" font-size="14">🛡</text>
      <text x="40" y="20" fill="#F0F3F8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">Max 4 Cached Background Processes</text>
      <text x="40" y="34" fill="#9DA4B0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9">Caps background task count to keep RAM fluid</text>
      <rect x="262" y="12" width="38" height="22" rx="11" fill="#222838"/>
      <circle cx="273" cy="23" r="8" fill="#9DA4B0"/>
    </g>

    <!-- Whitelist status -->
    <g transform="translate(14, 136)">
      <line x1="0" y1="0" x2="300" y2="0" stroke="#222838" stroke-width="0.8"/>
      <text x="10" y="20" fill="#00E676" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">Protected Whitelist: WhatsApp, Telegram, Spotify</text>
      <text x="10" y="34" fill="#9DA4B0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9">Whitelisted apps receive notifications immediately</text>
    </g>
  </g>

  <!-- Bottom Navigation Bar (Strictly 2 Tabs: Dashboard and Tweaks Active) -->
  <g transform="translate(0, 756)">
    <rect width="360" height="84" fill="#11141C" stroke="#1F2433" stroke-width="1"/>
    
    <!-- Tab 1: Dashboard -->
    <g transform="translate(90, 16)">
      <text x="-8" y="22" fill="#9DA4B0" text-anchor="middle" font-size="14">⚡</text>
      <text x="14" y="23" fill="#9DA4B0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">Dashboard</text>
    </g>

    <!-- Tab 2: Tweaks Active -->
    <g transform="translate(270, 16)">
      <rect x="-50" y="0" width="100" height="36" rx="18" fill="#0084FF" fill-opacity="0.18"/>
      <text x="-12" y="22" fill="#0084FF" text-anchor="middle" font-size="14">⚙</text>
      <text x="14" y="23" fill="#0084FF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">Tweaks</text>
    </g>
  </g>
</svg>
