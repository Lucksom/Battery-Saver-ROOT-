<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 780" width="360" height="780">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0C0E12" />
      <stop offset="100%" stop-color="#141822" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181C26" />
      <stop offset="100%" stop-color="#13161F" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="360" height="780" rx="36" fill="url(#bg)" stroke="#262D3D" stroke-width="2"/>

  <!-- Status Bar -->
  <text x="24" y="32" fill="#F0F3F8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">09:41</text>
  <rect x="320" y="23" width="18" height="10" rx="2" fill="none" stroke="#F0F3F8" stroke-width="1.2"/>
  <rect x="322" y="25" width="13" height="6" rx="1" fill="#00E676"/>

  <!-- App Header -->
  <text x="20" y="68" fill="#F0F3F8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700">Kernel &amp; Whitelist</text>
  <rect x="240" y="52" width="100" height="22" rx="11" fill="#00E676" fill-opacity="0.15" stroke="#00E676" stroke-width="1"/>
  <text x="290" y="66" fill="#00E676" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700">KERNEL 5.15</text>

  <!-- Section 1: Deep Sleep App Whitelist Picker -->
  <g transform="translate(20, 95)">
    <rect x="0" y="0" width="320" height="225" rx="16" fill="url(#cardGrad)" stroke="#222838" stroke-width="1"/>
    
    <text x="16" y="24" fill="#F0F3F8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">Deep Sleep Exception Whitelist</text>
    <rect x="238" y="12" width="68" height="18" rx="9" fill="#0084FF" fill-opacity="0.15"/>
    <text x="272" y="24" fill="#0084FF" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700">4 ACTIVE</text>

    <text x="16" y="44" fill="#9DA4B0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">Exempt essential apps from Doze suspension</text>

    <!-- App 1: WhatsApp (Selected & Pinned) -->
    <g transform="translate(16, 56)">
      <rect x="0" y="0" width="288" height="36" rx="8" fill="#1C2230"/>
      <circle cx="18" cy="18" r="11" fill="#25D366"/>
      <text x="18" y="22" fill="#FFFFFF" text-anchor="middle" font-size="12">💬</text>
      <text x="36" y="17" fill="#F0F3F8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">WhatsApp Messenger</text>
      <text x="36" y="29" fill="#00E676" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8">Pinned Active</text>
      <rect x="256" y="10" width="16" height="16" rx="4" fill="#0084FF"/>
      <text x="264" y="22" fill="#FFFFFF" text-anchor="middle" font-size="10" font-weight="800">✓</text>
    </g>

    <!-- App 2: Telegram (Selected & Pinned) -->
    <g transform="translate(16, 98)">
      <rect x="0" y="0" width="288" height="36" rx="8" fill="#1C2230"/>
      <circle cx="18" cy="18" r="11" fill="#0088CC"/>
      <text x="18" y="22" fill="#FFFFFF" text-anchor="middle" font-size="12">✈️</text>
      <text x="36" y="17" fill="#F0F3F8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">Telegram</text>
      <text x="36" y="29" fill="#00E676" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8">Pinned Active</text>
      <rect x="256" y="10" width="16" height="16" rx="4" fill="#0084FF"/>
      <text x="264" y="22" fill="#FFFFFF" text-anchor="middle" font-size="10" font-weight="800">✓</text>
    </g>

    <!-- App 3: Google Clock (Selected & Pinned) -->
    <g transform="translate(16, 140)">
      <rect x="0" y="0" width="288" height="36" rx="8" fill="#1C2230"/>
      <circle cx="18" cy="18" r="11" fill="#4285F4"/>
      <text x="18" y="22" fill="#FFFFFF" text-anchor="middle" font-size="12">⏰</text>
      <text x="36" y="17" fill="#F0F3F8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">Clock &amp; Alarms</text>
      <text x="36" y="29" fill="#00E676" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8">Pinned Active</text>
      <rect x="256" y="10" width="16" height="16" rx="4" fill="#0084FF"/>
      <text x="264" y="22" fill="#FFFFFF" text-anchor="middle" font-size="10" font-weight="800">✓</text>
    </g>

    <!-- Manage Whitelist Button -->
    <rect x="16" y="184" width="288" height="30" rx="8" fill="#0084FF" fill-opacity="0.15" stroke="#0084FF" stroke-width="1"/>
    <text x="160" y="203" fill="#0084FF" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">+ Select Whitelist Applications</text>
  </g>

  <!-- Section 2: Kernel I/O and Schedutil -->
  <g transform="translate(20, 335)">
    <rect x="0" y="0" width="320" height="200" rx="16" fill="url(#cardGrad)" stroke="#222838" stroke-width="1"/>
    <text x="16" y="24" fill="#F0F3F8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">Kernel Governors &amp; Storage</text>

    <!-- Schedutil Rate Limits -->
    <g transform="translate(16, 36)">
      <circle cx="14" cy="18" r="14" fill="#FFAB00" fill-opacity="0.15"/>
      <text x="14" y="22" fill="#FFAB00" text-anchor="middle" font-size="14">⚙️</text>
      <text x="36" y="14" fill="#F0F3F8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">Schedutil Rate Limiting</text>
      <text x="36" y="26" fill="#9DA4B0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9">up: 1,000µs / down: 20,000µs decay</text>

      <rect x="246" y="6" width="42" height="24" rx="12" fill="#00E676"/>
      <circle cx="276" cy="18" r="9" fill="#FFFFFF"/>
    </g>
    <line x1="16" y1="84" x2="304" y2="84" stroke="#222838" stroke-width="1"/>

    <!-- Dynamic FSync -->
    <g transform="translate(16, 92)">
      <circle cx="14" cy="18" r="14" fill="#00E5FF" fill-opacity="0.15"/>
      <text x="14" y="22" fill="#00E5FF" text-anchor="middle" font-size="14">💾</text>
      <text x="36" y="14" fill="#F0F3F8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">Dynamic FSync</text>
      <text x="36" y="26" fill="#9DA4B0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9">Flushes cache to storage on screen-off</text>

      <rect x="246" y="6" width="42" height="24" rx="12" fill="#00E676"/>
      <circle cx="276" cy="18" r="9" fill="#FFFFFF"/>
    </g>
    <line x1="16" y1="140" x2="304" y2="140" stroke="#222838" stroke-width="1"/>

    <!-- Storage I/O Scheduler -->
    <g transform="translate(16, 148)">
      <circle cx="14" cy="18" r="14" fill="#7C4DFF" fill-opacity="0.15"/>
      <text x="14" y="22" fill="#7C4DFF" text-anchor="middle" font-size="14">⚡</text>
      <text x="36" y="14" fill="#F0F3F8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">Storage I/O Optimizer</text>
      <text x="36" y="26" fill="#9DA4B0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9">MQ-Deadline / BFQ tuned readahead</text>

      <rect x="246" y="6" width="42" height="24" rx="12" fill="#00E676"/>
      <circle cx="276" cy="18" r="9" fill="#FFFFFF"/>
    </g>
  </g>

  <!-- Section 3: Root Execution Log Preview -->
  <g transform="translate(20, 550)">
    <rect x="0" y="0" width="320" height="130" rx="16" fill="#0F1219" stroke="#222838" stroke-width="1"/>
    <text x="16" y="22" fill="#00E676" font-family="monospace" font-size="10" font-weight="700"># su -c logs (latest)</text>
    <text x="16" y="42" fill="#9DA4B0" font-family="monospace" font-size="9">[OK] settings put global disable_window_blurs 0</text>
    <text x="16" y="58" fill="#9DA4B0" font-family="monospace" font-size="9">[OK] settings put secure user_refresh_rate 60</text>
    <text x="16" y="74" fill="#9DA4B0" font-family="monospace" font-size="9">[OK] persist.sys.aurogon.enabled 1</text>
    <text x="16" y="90" fill="#9DA4B0" font-family="monospace" font-size="9">[OK] thp_set_doze_mode_func 1 (digitizer doze)</text>
    <text x="16" y="106" fill="#00E5FF" font-family="monospace" font-size="9">[OK] Powersave profile committed with 0 errors</text>
  </g>

  <!-- Bottom Navigation Bar -->
  <g transform="translate(0, 700)">
    <rect width="360" height="80" fill="#11141C" stroke="#1F2433" stroke-width="1"/>
    <!-- Dashboard -->
    <text x="65" y="28" fill="#6B7280" text-anchor="middle" font-size="16">📊</text>
    <text x="65" y="48" fill="#6B7280" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">Dashboard</text>

    <!-- Tweaks -->
    <text x="145" y="28" fill="#6B7280" text-anchor="middle" font-size="16">⚙</text>
    <text x="145" y="48" fill="#6B7280" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">Tweaks</text>

    <!-- Profiles Active -->
    <circle cx="225" cy="24" r="14" fill="#0084FF" fill-opacity="0.2"/>
    <text x="225" y="28" fill="#0084FF" text-anchor="middle" font-size="16">⚡</text>
    <text x="225" y="48" fill="#0084FF" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700">Profiles</text>

    <!-- Logs -->
    <text x="300" y="28" fill="#6B7280" text-anchor="middle" font-size="16">📜</text>
    <text x="300" y="48" fill="#6B7280" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">Logs</text>
  </g>
</svg>
