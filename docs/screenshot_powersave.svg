<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 840" width="360" height="840">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0C0E12" />
      <stop offset="100%" stop-color="#141822" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#171A24" />
      <stop offset="100%" stop-color="#13161F" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="360" height="840" rx="36" fill="url(#bg)" stroke="#262D3D" stroke-width="2"/>

  <!-- Status Bar -->
  <text x="24" y="30" fill="#F0F3F8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">09:41</text>
  <circle cx="310" cy="26" r="3" fill="#00E676"/>
  <rect x="320" y="21" width="18" height="10" rx="2" fill="none" stroke="#F0F3F8" stroke-width="1.2"/>
  <rect x="322" y="23" width="13" height="6" rx="1" fill="#00E676"/>

  <!-- App Header -->
  <text x="20" y="64" fill="#F0F3F8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700">VoltPower Tweaks</text>
  <text x="20" y="78" fill="#9DA4B0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Granular RAM-Only Kernel Tuning</text>
  <rect x="238" y="50" width="102" height="24" rx="12" fill="#FF6D00" fill-opacity="0.15" stroke="#FF6D00" stroke-width="1"/>
  <text x="289" y="66" fill="#FF6D00" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700">POWERSAVE</text>

  <!-- Xiaomi HyperOS Card (Crisp Warm Background, Only for Miui/HyperOS, No Grey) -->
  <g transform="translate(16, 92)">
    <rect x="0" y="0" width="328" height="64" rx="20" fill="#1E1714" stroke="#FF6D00" stroke-width="1.5"/>
    
    <!-- Left Icon -->
    <rect x="14" y="12" width="40" height="40" rx="12" fill="#FF6D00" fill-opacity="0.18"/>
    <text x="34" y="37" fill="#FF6D00" text-anchor="middle" font-size="18">⚡</text>

    <!-- Text: Title & "Only for Miui/HyperOS" -->
    <text x="64" y="29" fill="#F0F3F8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700">Xiaomi HyperOS Mode</text>
    <rect x="220" y="17" width="46" height="16" rx="4" fill="#FF6D00" fill-opacity="0.18"/>
    <text x="243" y="29" fill="#FF6D00" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="800">ACTIVE</text>
    <text x="64" y="46" fill="#FF6D00" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500">Only for Miui/HyperOS</text>

    <!-- Toggle Switch (ON) -->
    <rect x="274" y="20" width="40" height="24" rx="12" fill="#FF6D00"/>
    <circle cx="302" cy="32" r="9" fill="#FFFFFF"/>
  </g>

  <!-- Section 1: Display & Refresh Rate -->
  <g transform="translate(16, 168)">
    <rect x="0" y="0" width="328" height="246" rx="20" fill="url(#cardGrad)" stroke="#222838" stroke-width="1"/>
    
    <!-- Title -->
    <text x="16" y="26" fill="#F0F3F8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">Display, Refresh Rate &amp; System</text>
    <rect x="246" y="12" width="68" height="18" rx="9" fill="#0084FF" fill-opacity="0.15"/>
    <text x="280" y="24" fill="#0084FF" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700">6 TWEAKS</text>

    <!-- 4 Refresh Rate Buttons -->
    <g transform="translate(14, 40)">
      <rect x="0" y="0" width="70" height="38" rx="10" fill="#1B1E28" stroke="#252C3D" stroke-width="1"/>
      <text x="35" y="20" fill="#F0F3F8" text-anchor="middle" font-size="11" font-weight="700">60 Hz</text>
      <text x="35" y="32" fill="#9DA4B0" text-anchor="middle" font-size="8">Powersave</text>

      <rect x="76" y="0" width="70" height="38" rx="10" fill="#1B1E28" stroke="#252C3D" stroke-width="1"/>
      <text x="111" y="20" fill="#F0F3F8" text-anchor="middle" font-size="11" font-weight="700">90 Hz</text>
      <text x="111" y="32" fill="#9DA4B0" text-anchor="middle" font-size="8">Balanced</text>

      <rect x="152" y="0" width="70" height="38" rx="10" fill="#1B1E28" stroke="#252C3D" stroke-width="1"/>
      <text x="187" y="20" fill="#F0F3F8" text-anchor="middle" font-size="11" font-weight="700">120 Hz</text>
      <text x="187" y="32" fill="#9DA4B0" text-anchor="middle" font-size="8">Smooth</text>

      <rect x="228" y="0" width="70" height="38" rx="10" fill="#0084FF" stroke="#0084FF" stroke-width="1.2"/>
      <text x="263" y="20" fill="#FFFFFF" text-anchor="middle" font-size="11" font-weight="800">Dynamic</text>
      <text x="263" y="32" fill="#FFFFFF" fill-opacity="0.8" text-anchor="middle" font-size="8">Stock Auto</text>
    </g>

    <!-- Tweak 1: Remove Control Center Blur -->
    <g transform="translate(14, 92)">
      <line x1="0" y1="0" x2="300" y2="0" stroke="#222838" stroke-width="0.8"/>
      <rect x="0" y="10" width="32" height="32" rx="8" fill="#7C4DFF" fill-opacity="0.15"/>
      <text x="16" y="31" fill="#7C4DFF" text-anchor="middle" font-size="14">🌫</text>
      <text x="40" y="22" fill="#F0F3F8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">Remove Control Center Blur</text>
      <text x="40" y="36" fill="#9DA4B0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9">Eliminates window blur (disable_window_blurs 1) for GPU savings</text>
      <rect x="262" y="14" width="38" height="22" rx="11" fill="#222838"/>
      <circle cx="273" cy="25" r="8" fill="#9DA4B0"/>
    </g>

    <!-- Tweak 2: Xiaomi THP Touch Doze Mode -->
    <g transform="translate(14, 142)">
      <line x1="0" y1="0" x2="300" y2="0" stroke="#222838" stroke-width="0.8"/>
      <rect x="0" y="10" width="32" height="32" rx="8" fill="#00E5FF" fill-opacity="0.15"/>
      <text x="16" y="31" fill="#00E5FF" text-anchor="middle" font-size="14">👆</text>
      <text x="40" y="22" fill="#F0F3F8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">Xiaomi THP Touch Doze Mode</text>
      <text x="40" y="36" fill="#9DA4B0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9">Enables Touch Host Processing doze (thp_set_doze_mode_func)</text>
      <rect x="262" y="14" width="38" height="22" rx="11" fill="#222838"/>
      <circle cx="273" cy="25" r="8" fill="#9DA4B0"/>
    </g>

    <!-- Tweak 3: System-Wide Dark Mode -->
    <g transform="translate(14, 192)">
      <line x1="0" y1="0" x2="300" y2="0" stroke="#222838" stroke-width="0.8"/>
      <rect x="0" y="10" width="32" height="32" rx="8" fill="#7C4DFF" fill-opacity="0.15"/>
      <text x="16" y="31" fill="#7C4DFF" text-anchor="middle" font-size="14">🌙</text>
      <text x="40" y="22" fill="#F0F3F8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">System-Wide Dark Mode</text>
      <text x="40" y="36" fill="#9DA4B0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9">Forces OLED black theme via UiModeManager night mode 2</text>
      <rect x="262" y="14" width="38" height="22" rx="11" fill="#222838"/>
      <circle cx="273" cy="25" r="8" fill="#9DA4B0"/>
    </g>
  </g>

  <!-- Section 2: CPU Scaling -->
  <g transform="translate(16, 426)">
    <rect x="0" y="0" width="328" height="150" rx="20" fill="url(#cardGrad)" stroke="#222838" stroke-width="1"/>
    <text x="16" y="26" fill="#F0F3F8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">CPU Energy Scaling &amp; Frequencies</text>
    <rect x="246" y="12" width="68" height="18" rx="9" fill="#00E676" fill-opacity="0.15"/>
    <text x="280" y="24" fill="#00E676" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700">3 TWEAKS</text>

    <!-- Tweak 1: Schedutil Governor -->
    <g transform="translate(14, 44)">
      <rect x="0" y="6" width="32" height="32" rx="8" fill="#00E676" fill-opacity="0.15"/>
      <text x="16" y="27" fill="#00E676" text-anchor="middle" font-size="14">⚙</text>
      <text x="40" y="18" fill="#F0F3F8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">Enforce Energy Schedutil Governor</text>
      <text x="40" y="32" fill="#9DA4B0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9">Pins energy-aware schedutil governor to all CPU clusters</text>
      <rect x="262" y="10" width="38" height="22" rx="11" fill="#222838"/>
      <circle cx="273" cy="21" r="8" fill="#9DA4B0"/>
    </g>

    <!-- Tweak 2: Offline Cores Below 20% -->
    <g transform="translate(14, 94)">
      <line x1="0" y1="0" x2="300" y2="0" stroke="#222838" stroke-width="0.8"/>
      <rect x="0" y="10" width="32" height="32" rx="8" fill="#00E5FF" fill-opacity="0.15"/>
      <text x="16" y="31" fill="#00E5FF" text-anchor="middle" font-size="14">🔋</text>
      <text x="40" y="22" fill="#F0F3F8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">Offline Cores Below 20% Battery</text>
      <text x="40" y="36" fill="#9DA4B0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9">Hotplugs 2 heavy cores to zero watts when battery is low</text>
      <rect x="262" y="14" width="38" height="22" rx="11" fill="#222838"/>
      <circle cx="273" cy="25" r="8" fill="#9DA4B0"/>
    </g>
  </g>

  <!-- Section 3: Whitelist Exceptions -->
  <g transform="translate(16, 588)">
    <rect x="0" y="0" width="328" height="150" rx="20" fill="url(#cardGrad)" stroke="#222838" stroke-width="1"/>
    <text x="16" y="26" fill="#F0F3F8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">Background App Exceptions</text>
    <rect x="246" y="12" width="68" height="18" rx="9" fill="#00E676" fill-opacity="0.15"/>
    <text x="280" y="24" fill="#00E676" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700">SHIELDED</text>

    <!-- System Shield box -->
    <rect x="14" y="40" width="300" height="52" rx="12" fill="#00E676" fill-opacity="0.08" stroke="#00E676" stroke-opacity="0.3" stroke-width="1"/>
    <text x="26" y="58" fill="#00E676" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">🔒 System Shield: Launcher &amp; SystemUI</text>
    <text x="26" y="74" fill="#9DA4B0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9">MIUI Home, SystemUI Core and Plugin permanently immune</text>

    <!-- User App Chips -->
    <g transform="translate(14, 104)">
      <rect x="0" y="0" width="94" height="30" rx="8" fill="#1C2230" stroke="#282C37" stroke-width="1"/>
      <text x="47" y="19" fill="#F0F3F8" text-anchor="middle" font-size="10">WhatsApp</text>

      <rect x="103" y="0" width="94" height="30" rx="8" fill="#1C2230" stroke="#282C37" stroke-width="1"/>
      <text x="150" y="19" fill="#F0F3F8" text-anchor="middle" font-size="10">Telegram</text>

      <rect x="206" y="0" width="94" height="30" rx="8" fill="#1C2230" stroke="#282C37" stroke-width="1"/>
      <text x="253" y="19" fill="#F0F3F8" text-anchor="middle" font-size="10">Spotify</text>
    </g>
  </g>

  <!-- Bottom Navigation Bar (Strictly 2 Tabs: Dashboard and Tweaks Active) -->
  <g transform="translate(0, 756)">
    <rect width="360" height="84" fill="#11141C" stroke="#1F2433" stroke-width="1"/>
    
    <!-- Tab 1: Dashboard -->
    <g transform="translate(90, 16)">
      <text x="-8" y="22" fill="#9DA4B0" text-anchor="middle" font-size="14">⚡</text>
      <text x="14" y="23" fill="#9DA4B0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">Dashboard</text>
    </g>

    <!-- Tab 2: Tweaks Active -->
    <g transform="translate(270, 16)">
      <rect x="-50" y="0" width="100" height="36" rx="18" fill="#0084FF" fill-opacity="0.18"/>
      <text x="-12" y="22" fill="#0084FF" text-anchor="middle" font-size="14">⚙</text>
      <text x="14" y="23" fill="#0084FF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">Tweaks</text>
    </g>
  </g>
</svg>
