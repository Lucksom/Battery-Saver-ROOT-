      <rect x="260" y="4" width="52" height="30" rx="15" fill="#A6C8FF"/>
      <circle cx="297" cy="19" r="11" fill="#002F64"/>
      <text x="297" y="23" fill="#C4DCFF" text-anchor="middle" font-size="11" font-weight="800">✓</text>
    </g>

    <line x1="18" y1="146" x2="330" y2="146" stroke="#424956" stroke-opacity="0.35"/>

    <!-- Row 3: Schedutil Rate Limits -->
    <g transform="translate(18, 162)">
      <text x="0" y="16" fill="#E0E3EB" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700">Schedutil Rate Limiting</text>
      <text x="0" y="34" fill="#C2C7D2" font-family="system-ui, -apple-system, sans-serif" font-size="11">Smooth frequency ramp-up (8ms up / 32ms down)</text>
      <rect x="260" y="4" width="52" height="30" rx="15" fill="#A6C8FF"/>
      <circle cx="297" cy="19" r="11" fill="#002F64"/>
      <text x="297" y="23" fill="#C4DCFF" text-anchor="middle" font-size="11" font-weight="800">✓</text>
