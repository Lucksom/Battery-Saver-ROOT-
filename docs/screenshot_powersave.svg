  <text x="20" y="152" fill="#A6C8FF" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="800" letter-spacing="0.8">CPU GOVERNOR &amp; CLUSTERS</text>

  <g transform="translate(16, 164)">
    <rect x="0" y="0" width="348" height="266" rx="28" fill="#1B2028"/>

