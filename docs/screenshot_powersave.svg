<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 780" width="360" height="780">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0C0E12" />
      <stop offset="100%" stop-color="#141822" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181C26" />
      <stop offset="100%" stop-color="#13161F" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="360" height="780" rx="36" fill="url(#bg)" stroke="#262D3D" stroke-width="2"/>

  <!-- Status Bar -->
  <text x="24" y="32" fill="#F0F3F8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">09:41</text>
  <rect x="320" y="23" width="18" height="10" rx="2" fill="none" stroke="#F0F3F8" stroke-width="1.2"/>
  <rect x="322" y="25" width="13" height="6" rx="1" fill="#00E676"/>

  <!-- App Header -->
  <text x="20" y="68" fill="#F0F3F8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700">HyperOS Power Saver</text>
  <rect x="238" y="52" width="102" height="22" rx="11" fill="#FFAB00" fill-opacity="0.15" stroke="#FFAB00" stroke-width="1"/>
  <text x="289" y="66" fill="#FFAB00" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700">⚡ SUPER SAVE</text>

  <!-- Section 1: Display & Refresh Rate -->
  <g transform="translate(20, 95)">
    <rect x="0" y="0" width="320" height="186" rx="16" fill="url(#cardGrad)" stroke="#222838" stroke-width="1"/>
    
    <!-- Title -->
    <text x="16" y="24" fill="#F0F3F8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">Display Refresh Rate</text>
    <rect x="236" y="12" width="70" height="18" rx="9" fill="#0084FF" fill-opacity="0.15"/>
    <text x="271" y="24" fill="#0084FF" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700">SYNCED</text>

    <!-- 4 Refresh Rate Buttons -->
    <g transform="translate(14, 38)">
      <!-- 60 Hz Selected -->
      <rect x="0" y="0" width="68" height="42" rx="10" fill="#0084FF" stroke="#0084FF" stroke-width="1.5"/>
      <text x="34" y="22" fill="#FFFFFF" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800">60 Hz</text>
      <text x="34" y="34" fill="#FFFFFF" fill-opacity="0.8" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8">Low Drain</text>

      <!-- 90 Hz -->
      <rect x="74" y="0" width="68" height="42" rx="10" fill="#1F232B" stroke="#282C37" stroke-width="1"/>
      <text x="108" y="22" fill="#9DA4B0" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">90 Hz</text>
      <text x="108" y="34" fill="#6B7280" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8">Smooth</text>

      <!-- 120 Hz -->
      <rect x="148" y="0" width="68" height="42" rx="10" fill="#1F232B" stroke="#282C37" stroke-width="1"/>
      <text x="182" y="22" fill="#9DA4B0" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">120 Hz</text>
      <text x="182" y="34" fill="#6B7280" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8">Ultra</text>

      <!-- Auto Dynamic -->
      <rect x="222" y="0" width="68" height="42" rx="10" fill="#1F232B" stroke="#282C37" stroke-width="1"/>
      <text x="256" y="22" fill="#9DA4B0" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">Auto</text>
      <text x="256" y="34" fill="#6B7280" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8">Adaptive</text>
    </g>

    <!-- Divider -->
    <line x1="16" y1="94" x2="304" y2="94" stroke="#222838" stroke-width="1"/>

    <!-- Control Center Blur Tweak Item -->
    <g transform="translate(16, 106)">
      <circle cx="14" cy="20" r="14" fill="#7C4DFF" fill-opacity="0.15"/>
      <text x="14" y="24" fill="#7C4DFF" text-anchor="middle" font-size="14">✨</text>
      <text x="36" y="16" fill="#F0F3F8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">Control Center Blur</text>
      <text x="36" y="30" fill="#9DA4B0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9">disable_window_blurs 0 / 1 toggle</text>

      <!-- Toggle Switch (ON) -->
      <rect x="246" y="8" width="42" height="24" rx="12" fill="#7C4DFF"/>
      <circle cx="276" cy="20" r="9" fill="#FFFFFF"/>
    </g>

    <!-- Divider -->
    <line x1="16" y1="146" x2="304" y2="146" stroke="#222838" stroke-width="1"/>

    <!-- Xiaomi Touch Doze Item -->
    <g transform="translate(16, 154)">
      <circle cx="14" cy="14" r="14" fill="#00E5FF" fill-opacity="0.15"/>
      <text x="14" y="18" fill="#00E5FF" text-anchor="middle" font-size="14">👆</text>
      <text x="36" y="12" fill="#F0F3F8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">THP Touch Doze Mode</text>
      <text x="36" y="24" fill="#9DA4B0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9">Digitizer idle power collapse</text>

      <!-- Toggle Switch (ON) -->
      <rect x="246" y="2" width="42" height="24" rx="12" fill="#00E676"/>
      <circle cx="276" cy="14" r="9" fill="#FFFFFF"/>
    </g>
  </g>

  <!-- Section 2: HyperOS System & Kernel Aggressive Tweaks -->
  <g transform="translate(20, 295)">
    <rect x="0" y="0" width="320" height="240" rx="16" fill="url(#cardGrad)" stroke="#222838" stroke-width="1"/>
    <text x="16" y="24" fill="#F0F3F8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">HyperOS Process &amp; Battery Saver</text>
    
    <!-- Item 1: Aurogon Freezer -->
    <g transform="translate(16, 36)">
      <circle cx="14" cy="18" r="14" fill="#0084FF" fill-opacity="0.15"/>
      <text x="14" y="22" fill="#0084FF" text-anchor="middle" font-size="14">❄️</text>
      <text x="36" y="14" fill="#F0F3F8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">Aurogon Process Freezer</text>
      <text x="36" y="26" fill="#9DA4B0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9">cgroup v2 aggressive task suspender</text>

      <rect x="246" y="6" width="42" height="24" rx="12" fill="#00E676"/>
      <circle cx="276" cy="18" r="9" fill="#FFFFFF"/>
    </g>
    <line x1="16" y1="84" x2="304" y2="84" stroke="#222838" stroke-width="1"/>

    <!-- Item 2: Touch Boost Disabler -->
    <g transform="translate(16, 92)">
      <circle cx="14" cy="18" r="14" fill="#FFAB00" fill-opacity="0.15"/>
      <text x="14" y="22" fill="#FFAB00" text-anchor="middle" font-size="14">⚡</text>
      <text x="36" y="14" fill="#F0F3F8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">Touch Boost Clamping</text>
      <text x="36" y="26" fill="#9DA4B0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9">Prevents unneeded 2GHz CPU jumps</text>

      <rect x="246" y="6" width="42" height="24" rx="12" fill="#00E676"/>
      <circle cx="276" cy="18" r="9" fill="#FFFFFF"/>
    </g>
    <line x1="16" y1="140" x2="304" y2="140" stroke="#222838" stroke-width="1"/>

    <!-- Item 3: 5G Power Optimization -->
    <g transform="translate(16, 148)">
      <circle cx="14" cy="18" r="14" fill="#00E5FF" fill-opacity="0.15"/>
      <text x="14" y="22" fill="#00E5FF" text-anchor="middle" font-size="14">📶</text>
      <text x="36" y="14" fill="#F0F3F8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">5G SA/NSA Energy Saver</text>
      <text x="36" y="26" fill="#9DA4B0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9">persist.vendor.radio.5g_power_save</text>

      <rect x="246" y="6" width="42" height="24" rx="12" fill="#00E676"/>
      <circle cx="276" cy="18" r="9" fill="#FFFFFF"/>
    </g>
    <line x1="16" y1="196" x2="304" y2="196" stroke="#222838" stroke-width="1"/>

    <!-- Item 4: Keep Light Mode Option -->
    <g transform="translate(16, 204)">
      <circle cx="14" cy="14" r="14" fill="#6B7280" fill-opacity="0.15"/>
      <text x="14" y="18" fill="#F0F3F8" text-anchor="middle" font-size="14">☀️</text>
      <text x="36" y="10" fill="#F0F3F8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">Preserve Light Mode</text>
      <text x="36" y="22" fill="#9DA4B0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9">Keeps light theme with battery saver</text>

      <!-- Toggle OFF -->
      <rect x="246" y="2" width="42" height="24" rx="12" fill="#282C37"/>
      <circle cx="258" cy="14" r="9" fill="#6B7280"/>
    </g>
  </g>

  <!-- Section 3: Background Scanning -->
  <g transform="translate(20, 550)">
    <rect x="0" y="0" width="320" height="130" rx="16" fill="url(#cardGrad)" stroke="#222838" stroke-width="1"/>
    <text x="16" y="24" fill="#F0F3F8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">Connectivity &amp; Radios</text>

    <!-- Bluetooth & WiFi Scan Throttle -->
    <g transform="translate(16, 36)">
      <circle cx="14" cy="18" r="14" fill="#0084FF" fill-opacity="0.15"/>
      <text x="14" y="22" fill="#0084FF" text-anchor="middle" font-size="14">📡</text>
      <text x="36" y="14" fill="#F0F3F8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">Disable Background Scanning</text>
      <text x="36" y="26" fill="#9DA4B0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9">Cuts BT &amp; Wi-Fi location poll drain</text>

      <rect x="246" y="6" width="42" height="24" rx="12" fill="#00E676"/>
      <circle cx="276" cy="18" r="9" fill="#FFFFFF"/>
    </g>
    <line x1="16" y1="84" x2="304" y2="84" stroke="#222838" stroke-width="1"/>

    <!-- Deep Sleep Screen Off -->
    <g transform="translate(16, 92)">
      <circle cx="14" cy="14" r="14" fill="#00E676" fill-opacity="0.15"/>
      <text x="14" y="18" fill="#00E676" text-anchor="middle" font-size="14">💤</text>
      <text x="36" y="10" fill="#F0F3F8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">Deep Sleep on Screen-Off</text>
      <text x="36" y="22" fill="#9DA4B0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9">Enters immediate Doze idle mode</text>

      <rect x="246" y="2" width="42" height="24" rx="12" fill="#00E676"/>
      <circle cx="276" cy="14" r="9" fill="#FFFFFF"/>
    </g>
  </g>

  <!-- Bottom Navigation Bar -->
  <g transform="translate(0, 700)">
    <rect width="360" height="80" fill="#11141C" stroke="#1F2433" stroke-width="1"/>
    <!-- Dashboard -->
    <text x="65" y="28" fill="#6B7280" text-anchor="middle" font-size="16">📊</text>
    <text x="65" y="48" fill="#6B7280" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">Dashboard</text>

    <!-- Tweaks Active -->
    <circle cx="145" cy="24" r="14" fill="#0084FF" fill-opacity="0.2"/>
    <text x="145" y="28" fill="#0084FF" text-anchor="middle" font-size="16">⚙</text>
    <text x="145" y="48" fill="#0084FF" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700">Tweaks</text>

    <!-- Profiles -->
    <text x="225" y="28" fill="#6B7280" text-anchor="middle" font-size="16">⚡</text>
    <text x="225" y="48" fill="#6B7280" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">Profiles</text>

    <!-- Logs -->
    <text x="300" y="28" fill="#6B7280" text-anchor="middle" font-size="16">📜</text>
    <text x="300" y="48" fill="#6B7280" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">Logs</text>
  </g>
</svg>
