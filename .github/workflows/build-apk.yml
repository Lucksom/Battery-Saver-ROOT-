name: Build & Release Signed APK

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build, Sign and Release APK
    runs-on: ubuntu-latest
    env:
      JAVA_TOOL_OPTIONS: "-Djava.awt.headless=true"
      GRADLE_OPTS: "-Dorg.gradle.jvmargs='-Xmx4g -Dfile.encoding=UTF-8 -Djava.awt.headless=true'"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Ensure Executable Permissions & Generate Test Keystore
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
          else
            gradle wrapper --gradle-version 9.3.1
            chmod +x gradlew
          fi

          if [ ! -f debug.keystore ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload Signed APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VoltPower-Release-APK
          path: app/build/outputs/apk/release/*.apk
          retention-days: 14

      - name: Publish to GitHub Releases
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.0' }}
          name: VoltPower ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.0' }}
          body: |
            ### VoltPower Kernel Optimizer (Release APK)
            - **Package:** `com.voltpower`
            - **Status:** Release Signed APK
            - **Features:** Powersave Governor, HyperOS Boost Clamp, Dynamic Core Parking, and Background App Power Prioritization.
            
            Download `app-release.apk` below.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
