name: Build & Release Signed APK

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build, Sign and Release APK
    runs-on: ubuntu-latest
    env:
      JAVA_TOOL_OPTIONS: "-Djava.awt.headless=true"
      GRADLE_OPTS: "-Dorg.gradle.jvmargs='-Xmx4g -Dfile.encoding=UTF-8 -Djava.awt.headless=true'"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Ensure Executable Permissions & Generate Test Keystore
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
          else
            gradle wrapper --gradle-version 9.3.1
            chmod +x gradlew
          fi

          if [ ! -f debug.keystore ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Determine New Release Tag
        if: github.event_name != 'pull_request'
        id: release_version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${{ github.ref_name }}"
          else
            git fetch --tags --force || true
            LATEST_PATCH=$(git tag -l "v1.0.*" | sed 's/v1\.0\.//' | grep -E '^[0-9]+$' | sort -n | tail -n 1)
            if [[ -z "$LATEST_PATCH" ]]; then
              NEXT_PATCH=${{ github.run_number }}
            else
              NEXT_PATCH=$((LATEST_PATCH + 1))
              if [[ "$NEXT_PATCH" -lt "${{ github.run_number }}" ]]; then
                NEXT_PATCH=${{ github.run_number }}
              fi
            fi
            TAG="v1.0.${NEXT_PATCH}"
          fi
          echo "Selected release tag: ${TAG}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Upload Signed APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VoltPower-Release-APK-${{ steps.release_version.outputs.tag || github.run_number }}
          path: app/build/outputs/apk/release/*.apk
          retention-days: 14

      - name: Publish to GitHub Releases
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
          tag_name: ${{ steps.release_version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: VoltPower ${{ steps.release_version.outputs.tag }}
          body: |
            ### VoltPower Kernel Optimizer (${{ steps.release_version.outputs.tag }})
            - **Package:** `com.voltpower`
            - **Build:** `#${{ github.run_number }}` (`${{ github.sha }}`)
            - **Status:** Release Signed APK
            - **Features:** Expressive Monet v2 UI, Powersave Governor, HyperOS Boost Clamp, Dynamic Core Parking, and Volatile RAM Kernel Tweak Engine.
            
            Download `app-release.apk` below.
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

